# builds and signs the browser extensions, creates a github release and
# publishes to npm whenever a version tag is pushed. package.json and both
# extension manifests must carry the same version as the tag. npm auth is
# oidc trusted publishing configured on npmjs.com, no token secret needed.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: check manifest versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for m in extension/firefox/manifest.json extension/chromium/manifest.json package.json; do
            V=$(node -p "require('./$m').version")
            if [ "$V" != "$TAG" ]; then
              echo "$m has version $V but the tag is $TAG - bump it before tagging"
              exit 1
            fi
          done

      - name: build chromium zip
        run: cd extension/chromium && zip -r ../../ytshim-chromium.zip .

      - name: sign firefox xpi via amo
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          npx --yes web-ext sign --source-dir extension/firefox --channel unlisted --artifacts-dir signed
          mv signed/*.xpi ytshim-firefox.xpi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ytshim-firefox.xpi ytshim-chromium.zip \
            --title "$GITHUB_REF_NAME" --generate-notes

      - name: publish to npm
        run: |
          # trusted publishing needs npm >= 11.5.1
          npm install -g npm@latest
          npm ci
          npm publish
